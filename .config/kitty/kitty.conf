# ─────────────────────────────────────────────────────────────────
# AryanOS — Kitty Terminal Styling Configuration
# ─────────────────────────────────────────────────────────────────

include colors.conf

# ── Font System ──────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# ── Color Palette ────────────────────────────────────────────────
# 70% Dark Backgrounds
background       #111111
# 20% Warm Ivory Text
foreground       #F5F0E6

# 10% Saffron & Gold Accents
cursor           #D97706
cursor_text_color #111111
selection_background #D4AF37
selection_foreground #111111

# ── Terminal Opacity & Window Style ──────────────────────────────
background_opacity 0.92
window_padding_width 12
confirm_os_window_close 0
hide_window_decorations yes

# ── Color Scheme Map (Aesthetic CS Theme) ────────────────────────
# Black
color0 #1A1A1A
color8 #1A1A1A

# Red (Crimson)
color1 #7F1D1D
color9 #7F1D1D

# Green
color2 #D4AF37
color10 #D4AF37

# Yellow (Saffron / Gold)
color3 #D97706
color11 #D4AF37

# Blue (Shiva Blue)
color4 #3B82F6
color12 #3B82F6

# Magenta
color5 #7F1D1D
color13 #7F1D1D

# Cyan
color6 #3B82F6
color14 #3B82F6

# White (Ivory)
color7 #F5F0E6
color15 #F5F0E6
