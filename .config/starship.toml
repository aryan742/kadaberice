# ─────────────────────────────────────────────────────────────────
# AryanOS — Minimalist Fast Cross-Shell Prompt (Starship)
# ─────────────────────────────────────────────────────────────────

# Inserts a blank line between shell prompts
add_newline = true

# Format definition (2-line prompt with status)
format = """
$os$username$directory$git_branch$git_status$python$nodejs$rust$golang$cmd_duration
$character
"""

# ── Character Prompt Symbol ──
[character]
success_symbol = "[❯](bold #f3bd6e)"
error_symbol = "[❯](bold #ef4444)"
vimcmd_symbol = "[❮](bold #b7cea2)"

# ── Operating System Indicator ──
[os]
format = "[$symbol ]($style)"
style = "bold #38bdf8"
disabled = false

[os.symbols]
Arch = "󰣇"
Linux = "󰌽"

# ── Username ──
[username]
style_user = "bold #ede0d4"
style_root = "bold #ef4444"
format = "[$user]($style) in "
disabled = false
show_always = false

# ── Directory ──
[directory]
style = "bold #f3bd6e"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"

# ── Git Branch & Status ──
[git_branch]
symbol = "󰘬 "
style = "bold #ddc2a1"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold #ffb4ab"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "󰞇 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇡${ahead_count}⇣${behind_count} "
untracked = "󰡯 "
stashed = "󰀼 "
modified = "󱗜 "
staged = "󰐗 "
renamed = "󰑕 "
deleted = "󰆴 "

# ── Execution Duration ──
[cmd_duration]
min_time = 2000
style = "bold #9b8f80"
format = "took [$duration]($style) "

# ── Language Modules (Clean Badges) ──
[python]
symbol = "󰌠 "
style = "bold #eab308"
format = "via [$symbol$pyenv_prefix($version )]($style)"

[nodejs]
symbol = "󰎙 "
style = "bold #22c55e"
format = "via [$symbol($version )]($style)"

[rust]
symbol = "󱘗 "
style = "bold #f97316"
format = "via [$symbol($version )]($style)"

[golang]
symbol = "󰟓 "
style = "bold #06b6d4"
format = "via [$symbol($version )]($style)"
