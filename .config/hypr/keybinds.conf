# ─────────────────────────────────────────────────────────────────
# AryanOS — Keybindings & Native Window Management
# Native Hyprland Dispatchers (0ms Latency, 0 External Scripts)
# ─────────────────────────────────────────────────────────────────

$mainMod = SUPER

# ── Application Binds ────────────────────────────────────────────
bind = $mainMod, Q, exec, kitty
bind = $mainMod, E, exec, thunar
bind = $mainMod, R, exec, rofi -show drun -theme dmenu
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, M, exec, wlogout || hyprctl dispatch exit

# ── Window States & Manipulations ────────────────────────────────
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, P, pseudo,
bind = $mainMod, S, layoutmsg, togglesplit
bind = $mainMod, Y, pin,                            # Pin floating window across workspaces
bind = $mainMod, X, centerwindow,                   # Center floating window on screen

# ── Native Window Grouping (Tabs) ────────────────────────────────
bind = $mainMod, G, togglegroup,                    # Group/Ungroup windows into tabs
bind = $mainMod ALT, Tab, changegroupactive, f      # Cycle forward through tabbed group

# ── Focus Navigation (Vim + Arrow Keys) ──────────────────────────
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ── Move Windows (Vim + Arrow Keys) ──────────────────────────────
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# ── Resize Windows (Vim + Arrow Keys) ────────────────────────────
binde = $mainMod ALT, h, resizeactive, -30 0
binde = $mainMod ALT, l, resizeactive, 30 0
binde = $mainMod ALT, k, resizeactive, 0 -30
binde = $mainMod ALT, j, resizeactive, 0 30

binde = $mainMod ALT, left, resizeactive, -30 0
binde = $mainMod ALT, right, resizeactive, 30 0
binde = $mainMod ALT, up, resizeactive, 0 -30
binde = $mainMod ALT, down, resizeactive, 0 30

# ── Multi-Monitor & Scratchpad Controls ──────────────────────────
bind = $mainMod, O, focusmonitor, +1                # Focus next monitor
bind = $mainMod SHIFT, O, movewindow, mon:+1        # Move window to next monitor

bind = $mainMod, U, togglespecialworkspace, magic   # Toggle scratchpad overlay
bind = $mainMod SHIFT, U, movetoworkspace, special:magic # Send window to scratchpad

# ── Workspace Navigation (1-9) ───────────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move Active Window to Workspace (1-9)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# ── Native Mouse Controls ────────────────────────────────────────
bindm = $mainMod, mouse:272, movewindow             # Super + Left Click Drag -> Move window
bindm = $mainMod, mouse:273, resizewindow           # Super + Right Click Drag -> Resize window
bind = $mainMod, mouse_down, workspace, e+1         # Super + Scroll Down -> Next workspace
bind = $mainMod, mouse_up, workspace, e-1           # Super + Scroll Up -> Prev workspace

# ── Screenshot System ────────────────────────────────────────────
$screenshot = ~/.config/hypr/scripts/screenshot.sh

# Print              → Full-screen screenshot
bind = , Print, exec, $screenshot full
# Super + Print      → Region selection screenshot
bind = $mainMod, Print, exec, $screenshot region
# Shift + Print      → Active window screenshot
bind = SHIFT, Print, exec, $screenshot window
# Super + Shift + Print  → Region selection → clipboard only (no file)
bind = $mainMod SHIFT, Print, exec, $screenshot region-cb
# Ctrl + Print       → Active window → clipboard only (no file)
bind = CTRL, Print, exec, $screenshot window-cb

# ── Session & Tool Integrations ──────────────────────────────────
# Lock Screen
bind = $mainMod SHIFT, L, exec, hyprlock

# Window Switcher (Alt + Tab)
bind = ALT, Tab, exec, snappy-switcher next
bind = ALT SHIFT, Tab, exec, snappy-switcher prev

# ── AGS Dashboard & Expo Overview ────────────────────────────────
# App Launcher Carousel
bind = $mainMod, Space, exec, ~/.config/hypr/scripts/toggle-ags.sh app-launcher
# Workspace Carousel
bind = $mainMod, Tab, exec, ~/.config/hypr/scripts/toggle-ags.sh workspace-carousel
# Wallpaper Carousel
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/toggle-ags.sh wallpaper-carousel
# Workspace 3D Expo Overview
bind = $mainMod, grave, hyprexpo:expo, toggle

# ── Presentation & Display Toggle ────────────────────────────────
bind = $mainMod SHIFT, P, exec, ~/.config/hypr/scripts/display_toggle.sh
bind = , XF86Display, exec, ~/.config/hypr/scripts/display_toggle.sh

# ── Multimedia & Hardware Keys ───────────────────────────────────
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
