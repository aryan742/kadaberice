# ─────────────────────────────────────────────────────────────────
# AryanOS — Idle Management Daemon (Hypridle)
# ─────────────────────────────────────────────────────────────────

general {
    lock_cmd = pidof hyprlock || hyprlock       # Avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # Lock screen before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # Turn display on upon resume
}

# 1. Dim screen brightness after 2.5 minutes of inactivity
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

# 2. Lock screen after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 3. Turn off display (DPMS off) after 6 minutes of inactivity
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 4. Suspend system after 30 minutes of inactivity
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
