# ─────────────────────────────────────────────────────────────────
# AryanOS — Intelligent Window Rules & Application Behavior
# Native Hyprland v0.55+ windowrulev2 Engine
# ─────────────────────────────────────────────────────────────────

# ── 1. Workspace Routing Rules ────────────────────────────────────

# Workspace 1: Terminals
windowrulev2 = workspace 1, class:^(kitty|Alacritty)$

# Workspace 2: Web Browsers
windowrulev2 = workspace 2, class:^(vivaldi-stable|firefox|google-chrome|Brave-browser|zen-browser|zen)$

# Workspace 3: Coding IDEs & Editors
windowrulev2 = workspace 3, class:^(code-oss|code|VSCode|jetbrains-.*|antigravity)$

# Workspace 6: Creative Suite
windowrulev2 = workspace 6, class:^(Gimp.*|inkscape|blender|kdenlive)$

# Workspace 7: Media Players
windowrulev2 = workspace 7, class:^(mpv|vlc|spotify)$

# Workspace 8: Virtual Machines
windowrulev2 = workspace 8, class:^(virt-manager|VirtualBox.*)$


# ── 2. Dialogs & File Choosers ────────────────────────────────────
windowrulev2 = float, title:^(Open File|Save As|Select a File|Choose Files|File Upload|Save File|Confirm to replace files|File Operation Progress)$
windowrulev2 = center, title:^(Open File|Save As|Select a File|Choose Files|File Upload|Save File|Confirm to replace files|File Operation Progress)$
windowrulev2 = size 900 600, title:^(Open File|Save As|Select a File|Choose Files|File Upload|Save File)$
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$


# ── 3. Authentication & Security Dialogs ──────────────────────────
windowrulev2 = float, class:^(polkit-kde-authentication-agent-1|org.kde.polkit-kde-authentication-agent-1|lxqt-policykit-agent)$
windowrulev2 = center, class:^(polkit-kde-authentication-agent-1|org.kde.polkit-kde-authentication-agent-1|lxqt-policykit-agent)$
windowrulev2 = pin, class:^(polkit-kde-authentication-agent-1|org.kde.polkit-kde-authentication-agent-1|lxqt-policykit-agent)$


# ── 4. Picture-in-Picture (PiP) ────────────────────────────────────
windowrulev2 = float, title:^(Picture-in-Picture|Picture in Picture|Picture in picture)$
windowrulev2 = pin, title:^(Picture-in-Picture|Picture in Picture|Picture in picture)$
windowrulev2 = size 640 360, title:^(Picture-in-Picture|Picture in Picture|Picture in picture)$
windowrulev2 = move 100%-660 100%-380, title:^(Picture-in-Picture|Picture in Picture|Picture in picture)$


# ── 5. System Utilities & Control Popups ──────────────────────────
windowrulev2 = float, class:^(pavucontrol|nm-connection-editor|blueman-manager|file-roller|org.gnome.FileRoller|gnome-calculator|org.gnome.Calculator|qalculate-gtk)$
windowrulev2 = size 800 600, class:^(pavucontrol)$
windowrulev2 = center, class:^(pavucontrol)$
windowrulev2 = size 700 500, class:^(blueman-manager)$
windowrulev2 = center, class:^(blueman-manager)$
windowrulev2 = size 400 550, class:^(gnome-calculator|org.gnome.Calculator|qalculate-gtk)$
windowrulev2 = center, class:^(gnome-calculator|org.gnome.Calculator|qalculate-gtk)$
windowrulev2 = opacity 0.95 0.90, class:^(pavucontrol|blueman-manager)$


# ── 6. Media & Image Viewers ──────────────────────────────────────
windowrulev2 = float, class:^(imv|viewnior|feh)$
windowrulev2 = center, class:^(imv|viewnior|feh)$


# ── 7. Gaming Applications ────────────────────────────────────────
windowrulev2 = float, class:^(Steam)$, title:^(Steam - News|Friends List|Settings)$
windowrulev2 = tile, class:^(Steam)$, title:^(Steam)$


# ── 8. System Layer Rules (Glassmorphism & Blur) ───────────────────
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, dunst
layerrule = ignorezero, dunst
