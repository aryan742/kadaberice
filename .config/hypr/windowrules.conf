# ─────────────────────────────────────────────────────────────────
# AryanOS — Intelligent Window Rules & Workspace Routing
# Native Hyprland Rules (Zero Daemons, Zero Plugins)
# ─────────────────────────────────────────────────────────────────

# ── 1. Workspace Application Routing ─────────────────────────────
# Workspace 1: Terminals
windowrulev2 = workspace 1, class:^(kitty)$
windowrulev2 = workspace 1, class:^(Alacritty)$

# Workspace 2: Web Browsers
windowrulev2 = workspace 2, class:^(vivaldi-stable)$
windowrulev2 = workspace 2, class:^(firefox)$
windowrulev2 = workspace 2, class:^(google-chrome)$
windowrulev2 = workspace 2, class:^(Brave-browser)$
windowrulev2 = workspace 2, class:^(zen-alpha)$

# Workspace 3: Software Development & IDEs
windowrulev2 = workspace 3, class:^(code-oss)$
windowrulev2 = workspace 3, class:^(code)$
windowrulev2 = workspace 3, class:^(VSCode)$
windowrulev2 = workspace 3, class:^(jetbrains-.*)$

# Workspace 6: Creative Suite
windowrulev2 = workspace 6, class:^(Gimp.*)$
windowrulev2 = workspace 6, class:^(inkscape)$
windowrulev2 = workspace 6, class:^(blender)$
windowrulev2 = workspace 6, class:^(kdenlive)$

# Workspace 7: Media & Audio Players
windowrulev2 = workspace 7, class:^(spotify)$

# Workspace 8: Virtualization & Containers
windowrulev2 = workspace 8, class:^(virt-manager)$
windowrulev2 = workspace 8, class:^(VirtualBox.*)$


# ── 2. Dialog & File Selector Windows ─────────────────────────────
# Common GTK/Qt/KDE file open, save, print, and preferences dialogs
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Select a File)$
windowrulev2 = float, title:^(Choose Files)$
windowrulev2 = float, title:^(Save As)$
windowrulev2 = float, title:^(Save File)$
windowrulev2 = float, title:^(Print)$
windowrulev2 = float, title:^(Preferences)$
windowrulev2 = float, title:^(Settings)$
windowrulev2 = float, title:^(Properties)$

windowrulev2 = center, title:^(Open File)$
windowrulev2 = center, title:^(Save As)$
windowrulev2 = center, title:^(Print)$
windowrulev2 = size 900 650, title:^(Open File)$
windowrulev2 = size 900 650, title:^(Save As)$

# XDG Desktop Portal File Picker
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = center, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = size 900 650, class:^(xdg-desktop-portal-gtk)$


# ── 3. Authentication & Permission Dialogs ───────────────────────
# Polkit & sudo authentication prompts must be centered, floating, and immediately focused
windowrulev2 = float, class:^(polkit-kde-authentication-agent-1)$
windowrulev2 = float, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrulev2 = float, class:^(gcr-prompter)$
windowrulev2 = float, class:^(pinentry-.*)$

windowrulev2 = center, class:^(polkit-kde-authentication-agent-1)$
windowrulev2 = center, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrulev2 = center, class:^(gcr-prompter)$
windowrulev2 = center, class:^(pinentry-.*)$


# ── 4. Picture-in-Picture (PiP) Rules ─────────────────────────────
# Floating video overlays for web browsers (Firefox, Vivaldi, Chrome, Brave)
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = float, title:^(Picture in picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture in picture)$
windowrulev2 = size 640 360, title:^(Picture-in-Picture)$
windowrulev2 = size 640 360, title:^(Picture in picture)$
windowrulev2 = move 1260 690, title:^(Picture-in-Picture)$
windowrulev2 = move 1260 690, title:^(Picture in picture)$


# ── 5. System Utilities & Control Panels ───────────────────────────
# Pavucontrol Audio Mixer
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = size 800 550, class:^(pavucontrol)$
windowrulev2 = center, class:^(pavucontrol)$
windowrulev2 = opacity 0.95, class:^(pavucontrol)$

# Blueman Bluetooth Manager
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = size 700 500, class:^(blueman-manager)$
windowrulev2 = center, class:^(blueman-manager)$
windowrulev2 = opacity 0.95, class:^(blueman-manager)$

# Network Manager Editor
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = center, class:^(nm-connection-editor)$

# Archive Manager (File Roller / Engrampa)
windowrulev2 = float, class:^(file-roller)$
windowrulev2 = float, class:^(org.gnome.FileRoller)$
windowrulev2 = center, class:^(file-roller)$

# Calculator & Color Picker
windowrulev2 = float, class:^(gnome-calculator)$
windowrulev2 = float, class:^(org.gnome.Calculator)$
windowrulev2 = float, class:^(hyprpicker)$


# ── 6. File Manager Auxiliary Dialogs ──────────────────────────────
# Thunar file operation popups
windowrulev2 = float, class:^(Thunar)$, title:^(File Operation Progress)$
windowrulev2 = float, class:^(Thunar)$, title:^(Confirm to replace files)$
windowrulev2 = center, class:^(Thunar)$, title:^(Confirm to replace files)$


# ── 7. Media & Image Applications ──────────────────────────────────
# Image viewers & Media players
windowrulev2 = float, class:^(imv)$
windowrulev2 = float, class:^(feh)$
windowrulev2 = float, class:^(mpv)$
windowrulev2 = size 1000 600, class:^(mpv)$
windowrulev2 = center, class:^(mpv)$


# ── 8. Gaming & Compatibility Rules ────────────────────────────────
# Steam popups & notifications
windowrulev2 = float, class:^(steam)$, title:^(Friends List)$
windowrulev2 = float, class:^(steam)$, title:^(News)$
windowrulev2 = float, class:^(steam)$, title:^.* - Chat$
windowrulev2 = tile, class:^(steam)$, title:^(Steam)$

# Heroic / Lutris game launchers
windowrulev2 = float, class:^(heroic)$, title:^(.*Settings.*)$


# ── 9. Layer Rules & UI Overlays ───────────────────────────────────
# Glassmorphic blur for Waybar top panel
layerrule = blur, waybar
layerrule = ignorezero, waybar
