# ─────────────────────────────────────────────────────────────────
# AryanOS — Intelligent Window Rules & Application Behavior
# Native Hyprland v0.55+ Engine (Unified match: syntax)
# ─────────────────────────────────────────────────────────────────

# ── 1. Workspace Routing Rules ────────────────────────────────────

# Workspace 1: Terminals
windowrule = workspace 1, match:class ^(kitty|Alacritty)$

# Workspace 2: Web Browsers
windowrule = workspace 2, match:class ^(vivaldi-stable|firefox|google-chrome|Brave-browser|zen-browser|zen)$

# Workspace 3: Coding IDEs & Editors
windowrule = workspace 3, match:class ^(code-oss|code|VSCode|jetbrains-.*|antigravity)$

# Workspace 6: Creative Suite
windowrule = workspace 6, match:class ^(Gimp.*|inkscape|blender|kdenlive)$

# Workspace 7: Media Players
windowrule = workspace 7, match:class ^(mpv|vlc|spotify)$

# Workspace 8: Virtual Machines
windowrule = workspace 8, match:class ^(virt-manager|VirtualBox.*)$


# ── 2. Dialogs & File Choosers ────────────────────────────────────
windowrule = float 1, match:title ^(Open File|Save As|Select a File|Choose Files|File Upload|Save File|Confirm to replace files|File Operation Progress)$
windowrule = center 1, match:title ^(Open File|Save As|Select a File|Choose Files|File Upload|Save File|Confirm to replace files|File Operation Progress)$
windowrule = size 900 600, match:title ^(Open File|Save As|Select a File|Choose Files|File Upload|Save File)$
windowrule = float 1, match:class ^(xdg-desktop-portal-gtk)$


# ── 3. Authentication & Security Dialogs ──────────────────────────
windowrule = float 1, match:class ^(polkit-kde-authentication-agent-1|org.kde.polkit-kde-authentication-agent-1|lxqt-policykit-agent)$
windowrule = center 1, match:class ^(polkit-kde-authentication-agent-1|org.kde.polkit-kde-authentication-agent-1|lxqt-policykit-agent)$
windowrule = pin 1, match:class ^(polkit-kde-authentication-agent-1|org.kde.polkit-kde-authentication-agent-1|lxqt-policykit-agent)$


# ── 4. Picture-in-Picture (PiP) ────────────────────────────────────
windowrule = float 1, match:title ^(Picture-in-Picture|Picture in Picture|Picture in picture)$
windowrule = pin 1, match:title ^(Picture-in-Picture|Picture in Picture|Picture in picture)$
windowrule = size 640 360, match:title ^(Picture-in-Picture|Picture in Picture|Picture in picture)$
windowrule = move 100%-660 100%-380, match:title ^(Picture-in-Picture|Picture in Picture|Picture in picture)$


# ── 5. System Utilities & Control Popups ──────────────────────────
windowrule = float 1, match:class ^(pavucontrol|nm-connection-editor|blueman-manager|file-roller|org.gnome.FileRoller|gnome-calculator|org.gnome.Calculator|qalculate-gtk)$
windowrule = size 800 600, match:class ^(pavucontrol)$
windowrule = center 1, match:class ^(pavucontrol)$
windowrule = size 700 500, match:class ^(blueman-manager)$
windowrule = center 1, match:class ^(blueman-manager)$
windowrule = size 400 550, match:class ^(gnome-calculator|org.gnome.Calculator|qalculate-gtk)$
windowrule = center 1, match:class ^(gnome-calculator|org.gnome.Calculator|qalculate-gtk)$
windowrule = opacity 0.95 0.90, match:class ^(pavucontrol|blueman-manager)$


# ── 6. Media & Image Viewers ──────────────────────────────────────
windowrule = float 1, match:class ^(imv|viewnior|feh)$
windowrule = center 1, match:class ^(imv|viewnior|feh)$


# ── 7. Gaming Applications ────────────────────────────────────────
windowrule = float 1, match:class ^(Steam)$, match:title ^(Steam - News|Friends List|Settings)$
windowrule = tile 1, match:class ^(Steam)$, match:title ^(Steam)$


# ── 8. System Layer Rules (Glassmorphism & Blur) ───────────────────
layerrule = blur true, match:namespace waybar
layerrule = blur true, match:namespace dunst
