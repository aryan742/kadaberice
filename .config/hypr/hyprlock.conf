# ─────────────────────────────────────────────────────────────────
# AryanOS — Dynamic Matugen Lockscreen (Hyprlock)
# ─────────────────────────────────────────────────────────────────

source = ~/.config/hypr/colors.conf

# ── Dynamic Blurred Screenshot Background ──
background {
    monitor =
    path = screenshot
    color = $matugen_background

    # Apple-fluid glassmorphic blur
    blur_passes = 3
    blur_size = 8
    noise = 0.012
    contrast = 0.88
    brightness = 0.72
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# ── Primary Time Display ──
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I:%M %p')"
    color = $matugen_primary
    font_size = 80
    font_family = Inter, JetBrainsMono Nerd Font
    position = 0, 130
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
}

# ── Formatted Date ──
label {
    monitor =
    text = cmd[update:60000] echo "<b>$(date +'%A, %d %B %Y')</b>"
    color = $matugen_on_surface
    font_size = 20
    font_family = Inter, JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = center
}

# ── Cultural Dharma Quote ──
label {
    monitor =
    text = ॐ असतो मा सद्गमय । तमसो मा ज्योतिर्गमय ।
    color = $matugen_outline
    font_size = 14
    font_family = Noto Sans Devanagari, Inter
    position = 0, 5
    halign = center
    valign = center
}

# ── User Greeting Badge ──
label {
    monitor =
    text = 󰀉 Welcome, $USER
    color = $matugen_on_surface
    font_size = 15
    font_family = Inter, JetBrainsMono Nerd Font
    position = 0, -85
    halign = center
    valign = center
}

# ── Password Pill Input Field ──
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.18
    dots_center = true
    dots_rounding = -1
    
    outer_color = $matugen_primary
    inner_color = $matugen_surface
    font_color = $matugen_on_surface
    
    fade_on_empty = false
    placeholder_text = <span foreground="##9b8f80">󰌾 Enter password...</span>
    hide_input = false
    rounding = 24
    
    check_color = $matugen_primary
    fail_color = rgb(239, 68, 68)
    fail_text = <i>Incorrect password <b>($ATTEMPTS)</b></i>
    fail_transition = 250
    capslock_color = rgb(245, 158, 11)
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    
    position = 0, -145
    halign = center
    valign = center
}

# ── Bottom System Status / Power Info ──
label {
    monitor =
    text = cmd[update:10000] echo "󰚥 AC Connected  •  󰌾 AryanOS Locked"
    color = $matugen_outline
    font_size = 12
    font_family = JetBrainsMono Nerd Font, Inter
    position = 0, 30
    halign = center
    valign = bottom
}
