# ── Portal & DBus Environment (PipeWire Screen Sharing) ─────────
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# ── Polkit (Authentication UI agent) ─────────────────────────────
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# ── Desktop Status Bar & UI ──────────────────────────────────────
exec-once = waybar
exec-once = gjs -m ~/.config/ags/app.js

# ── Notifications Daemon ──────────────────────────────────────────
exec-once = dunst

# ── Clipboard History (wl-clipboard & cliphist integration) ─────
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ── Wallpaper Setup ──────────────────────────────────────────────
# Restore active wallpaper (waypaper launches hyprpaper backend as needed)
exec-once = waypaper --restore

# ── Window Switcher (Snappy Switcher) ────────────────────────────
exec-once = snappy-switcher --daemon

# ── Cursor & Theme Integration ────────────────────────────────────
exec-once = hyprctl setcursor Bibata-Modern-Ice 24
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Ice'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Colloid-Dark'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'BeautyLine'

# ── Plugins Reload (hyprpm self-healing integration) ────────────
exec-once = ~/.config/hypr/scripts/hyprpm-auto-update.sh &
