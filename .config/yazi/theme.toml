# ─────────────────────────────────────────────────────────────────
# AryanOS — Yazi File Manager Custom Theme
# ─────────────────────────────────────────────────────────────────

[manager]
    # Highlight color for selected items (Gold background, dark foreground)
    border_symbol = "│"
    
[status]
    # Status line styling (Ivory text, deep crimson alert badges)
    separator_open  = ""
    separator_close = ""

[filetype]
    # Directory highlighting with beautiful Gold accent
    rules = [
        { mime = "inode/directory", fg = "#D4AF37" },
        
        # Executable and Scripts with Saffron accent
        { exec = "*", fg = "#D97706" },
        
        # Media and photos with Shiva Blue accent
        { mime = "image/*", fg = "#3B82F6" },
        { mime = "video/*", fg = "#3B82F6" },
        
        # Documents and logs with warm Ivory
        { mime = "text/*", fg = "#F5F0E6" }
    ]
